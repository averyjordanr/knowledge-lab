<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#111317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Knowledge Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="knowledge-lab-icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="knowledge-lab-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="knowledge-lab-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="knowledge-lab-icon-152.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Kalam:wght@400&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: a single page of ruled notebook paper. A red margin line runs down the left; page references sit in the margin.
   One ink colour for everything typed, red pen (handwritten) only for corrections. */
:root{
  --paper:#f8f6ef; --ink:#2a2d33; --soft:#6d6e70; --line:#bcd5ea; --margin:#e89aa1; --red:#c8372d; --pen:#26449a;
  --text:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Kalam","Segoe Print","Bradley Hand",cursive;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --m:44px; --cue:112px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1d1e21; --ink:#e7e5df; --soft:#a2a3a5; --line:#2d3b4c; --margin:#7d3f45; --red:#ff8b7b; --pen:#a3b8ff; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#1d1e21; --ink:#e7e5df; --soft:#a2a3a5; --line:#2d3b4c; --margin:#7d3f45; --red:#ff8b7b; --pen:#a3b8ff; color-scheme:dark }
@media (min-width:600px){ :root{ --m:84px; --cue:200px } }

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6}
*{box-sizing:border-box}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.top{display:flex;align-items:baseline;gap:10px;padding-block:14px 10px;padding-left:var(--gl);padding-right:var(--gr)}
.brand{font-weight:600;font-size:17px}
.sim{color:var(--soft);font-size:13px}
.grow{flex:1}
.sync{display:flex;align-items:center;gap:6px;color:var(--soft);background:none;border:0;padding:4px 0;cursor:pointer;font-size:13px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}
.sync.pending .dot{background:var(--red)} .sync.off .dot{background:none;border:1.5px solid var(--soft)}
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding-left:var(--gl);padding-right:var(--gr);padding-bottom:env(safe-area-inset-bottom, 0px);background:var(--paper)}
.nav button{background:none;border:0;padding:12px 4px;color:var(--soft);cursor:pointer;font-size:14px;min-height:46px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.main{overflow-y:auto;min-height:0;min-width:0}
@media (min-width:600px){
  .app{grid-template-rows:auto auto 1fr}
  .nav{grid-row:2;justify-content:flex-start;gap:22px;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  .nav button{padding:6px 0 10px;min-height:40px;font-size:15px}
  .main{grid-row:3}
}

@media (max-width:400px){ .sim{display:none} .top{gap:8px} .nav{padding-left:max(6px, env(safe-area-inset-left, 0px));padding-right:max(6px, env(safe-area-inset-right, 0px))} .nav button{font-size:13px;padding-inline:2px} }
.top > *{min-width:0}

/* The page: red margin line, content to its right */
.pg{position:relative;max-width:820px;margin-inline:auto;padding-block:24px 64px;padding-left:calc(var(--gl) + var(--m) + 14px);padding-right:var(--gr);min-height:100%}
.pg::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--gl) + var(--m));width:1.5px;background:var(--margin)}
.mg{display:grid;grid-template-columns:var(--m) 1fr;column-gap:14px;margin-left:calc(-1 * (var(--m) + 14px))}
.mg > .ref{padding-right:10px;text-align:right;font-size:12.5px;line-height:1.5;color:var(--soft);padding-top:3px;overflow-wrap:anywhere}
.mg > .ref b{display:block;font-weight:500;color:var(--ink)}
.mg > div{min-width:0}

/* Cornell: a cue column left of the red rule, notes to the right, a summary across the foot */
.cornell .pg{padding-left:var(--gl)}
.cornell .pg::before{display:none}
.cornell .mg{margin-left:0;grid-template-columns:var(--cue) 1fr;column-gap:0}
.cornell .mg.head{display:block}
.cornell .mg.head > .ref{display:none}
.cornell .mg > .ref{text-align:left;padding:3px 12px 0 0;border-right:1.5px solid var(--margin)}
.cornell .mg > .ref b{display:inline;font-weight:500}
.cornell .mg > div:not(.ref){padding-left:14px}
.cornell .mg.head > div:not(.ref){padding-left:0}
.cue{display:block;color:var(--pen);font-size:14.5px;line-height:1.45;margin-bottom:5px;overflow-wrap:break-word}
.cue.none{color:var(--soft);font-style:italic;font-size:13px}
.summary{border-top:3px double var(--line);padding-top:14px}
.covered{min-height:44px;height:100%;border-radius:2px;display:grid;place-items:center;color:var(--soft);font-size:13px;background:repeating-linear-gradient(-45deg,var(--line) 0 1.5px,transparent 1.5px 7px)}
.pagebtn{color:var(--soft);background:none;border:0;padding:4px 0;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}

h1{font-size:26px;font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:0;color:var(--soft)}
p{margin:0}
.soft{color:var(--soft)}
.small{font-size:14px;color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.loose{gap:30px}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.date{font-size:13px;color:var(--soft)}
.big{font-size:26px;font-weight:600}

/* Ruled lines between entries */
.lines{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lines > *{border-bottom:1px solid var(--line);padding-block:10px}
.kind{font-size:13px;color:var(--soft)}
.q-mark{color:var(--soft);font-weight:600;margin-right:4px}
.quote{font-style:italic}
.eq{font-size:17px;padding:4px 0;overflow-x:auto;white-space:nowrap;font-style:italic}

/* Controls kept plain */
.btn{border:1px solid var(--ink);background:none;border-radius:4px;padding:8px 16px;cursor:pointer;min-height:44px;font-weight:500}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.link{border:0;padding:8px 2px;text-decoration:underline;text-underline-offset:3px;color:var(--soft);font-weight:400}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:4px 20px}
.opts.col{flex-direction:column;gap:0}
.opt{display:flex;align-items:center;gap:9px;background:none;border:0;padding:7px 0;cursor:pointer;text-align:left;min-height:40px}
.opt::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--soft);flex:none}
.opt[aria-pressed="true"]{font-weight:600}
.opt[aria-pressed="true"]::before{border-color:var(--ink);background:radial-gradient(var(--ink) 0 3px,transparent 3.5px)}
textarea,input[type=text]{width:100%;background:transparent;border:0;border-bottom:1px solid var(--soft);padding:6px 2px;border-radius:0}
textarea{min-height:160px;resize:vertical;line-height:32px;padding:0 2px;border:0;
  background-image:linear-gradient(transparent 31px,var(--line) 31px);background-size:100% 32px;background-attachment:local}
textarea.red{font-family:var(--hand);font-size:19px;color:var(--red)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--soft)}
.attempt p{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--pen)}
/* Blue ballpoint for everything you write; graphite for the app's own words */
.lines .mg p:not(.small), .lines .eq, textarea, input[type=text]{color:var(--pen)}
.lines .mg p.small{color:var(--soft)}
.fix p{font-family:var(--hand);font-size:19px;line-height:1.5;color:var(--red);white-space:pre-wrap;overflow-wrap:anywhere}
.closed-note{color:var(--soft);font-style:italic}
.grades{display:flex;flex-wrap:wrap;gap:8px}
.grades .btn{display:flex;flex-direction:column;align-items:center;line-height:1.3;padding:8px 14px;flex:1 1 120px}
.grades small{font-size:12.5px;color:var(--soft)}
.split{display:flex;flex-direction:column;gap:30px}
@media (min-width:640px){ .split{display:grid;grid-template-columns:minmax(170px,220px) 1fr;gap:32px;align-items:start} .split > *{min-width:0} .only-compact{display:none !important} }
@media (min-width:640px){ .app:not(.cornell) .split .mg{margin-left:0;grid-template-columns:72px 1fr;column-gap:12px} .app:not(.cornell) .split .mg > .ref{text-align:left;padding-right:0;overflow-wrap:normal} .cornell .split .mg{grid-template-columns:120px 1fr} }
@media (max-width:639.98px){ .split > .detail.closed, .split > .list.closed{display:none} }
.pick{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 0;cursor:pointer}
.pick.sel .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.pick .t{font-weight:500}
.hist{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:15px}
.hist span:nth-child(2n){color:var(--soft)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(76px + env(safe-area-inset-bottom, 0px));z-index:5;border-radius:999px;padding:10px 18px}
@media (min-width:600px){ .fab{bottom:calc(24px + env(safe-area-inset-bottom, 0px))} }
.sheet-bg{position:fixed;inset:0;background:rgba(15,17,20,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:560px;padding:20px var(--gr) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gl);border-radius:8px 8px 0 0}
@media (min-width:600px){ .sheet-bg{align-items:center} .sheet{border-radius:8px;padding:24px} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .16s ease-out} @keyframes up{from{opacity:0;transform:translate(-50%,6px)}} }
/* Problems lab: graph paper for working, plain tags, placeholders for imported pages */
.app{--gline:color-mix(in srgb, var(--line) 60%, transparent)}
textarea.grid, .gridbox{background-image:linear-gradient(var(--gline) 1px,transparent 1px),linear-gradient(90deg,var(--gline) 1px,transparent 1px);background-size:16px 16px;background-attachment:local;line-height:32px}
textarea.grid{min-height:224px}
textarea.short{min-height:64px}
.gridbox{padding:0 2px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--pen);min-height:64px}
.lines .mg p.stmt{color:var(--ink);font-size:17px}
.thumb{min-height:64px;display:grid;place-items:center;text-align:center;padding:8px;color:var(--soft);font-size:13px;border:1px dashed var(--soft);background:repeating-linear-gradient(-45deg,var(--gline) 0 1.5px,transparent 1.5px 8px)}
.calc{display:flex;gap:10px;align-items:flex-end}
.calc label{flex:1}
.calcline{color:var(--pen);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hintline{font-size:15px}
.hintline b{font-weight:500;color:var(--soft)}
.sol{white-space:pre-wrap;font-size:15.5px;border-left:2px solid var(--line);padding-left:12px}
.opt.passed::before{border-color:var(--ink);background:var(--ink)}
.opt.failed::before{border-color:var(--red);background:var(--red)}
/* Notebook on a desk: coloured index tabs, a paper sheet, pen colours, graph blocks */
:root{ --desk:#e7e1d4; --c-today:#e2a13a; --c-books:#5a8fe6; --c-problems:#46a877; --c-concepts:#9a73cf; --c-progress:#e07a8b;
  --pen-blue:var(--pen); --pen-black:var(--ink); --pen-green:#1d7a4c; --pen-purple:#6d3fa6; --pen-orange:#b55a00 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --desk:#111214; --c-today:#c98f33; --c-books:#5a86d6; --c-problems:#3f9a6c; --c-concepts:#8c68c0; --c-progress:#cc6f7f; --pen-green:#7fd3a4; --pen-purple:#c3a4f2; --pen-orange:#f2b06a } }
:root[data-theme="dark"]{ --desk:#111214; --c-today:#c98f33; --c-books:#5a86d6; --c-problems:#3f9a6c; --c-concepts:#8c68c0; --c-progress:#cc6f7f; --pen-green:#7fd3a4; --pen-purple:#c3a4f2; --pen-orange:#f2b06a }
body{background:var(--desk)}
.app{--acc:var(--c-today)}
.app[data-sec=books]{--acc:var(--c-books)} .app[data-sec=problems]{--acc:var(--c-problems)} .app[data-sec=concepts]{--acc:var(--c-concepts)} .app[data-sec=progress]{--acc:var(--c-progress)}
.nav{background:var(--desk)}
.nav button{box-shadow:inset 0 3px 0 transparent}
.nav button[aria-current="page"]{text-decoration:none;box-shadow:inset 0 3px 0 var(--tc)}
.pg{background:var(--paper)}
@media (min-width:600px){
  .top,.nav{max-width:852px;width:100%;margin-inline:auto}
  .nav{gap:4px;border-bottom:0;align-items:flex-end}
  .nav button{background:color-mix(in srgb, var(--tc) 30%, var(--desk));border-radius:9px 9px 0 0;padding:9px 16px 8px;color:var(--ink);box-shadow:none}
  .nav button[aria-current="page"]{background:var(--paper);box-shadow:inset 0 4px 0 var(--tc)}
  .main{padding:0 16px 24px}
  .pg{border-radius:0 6px 6px 6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 28px rgba(0,0,0,.09)}
}
h1{font-family:var(--hand);font-weight:400;font-size:34px;line-height:1.3;align-self:flex-start;padding:0 6px;margin-left:-6px;background:linear-gradient(transparent 58%, color-mix(in srgb, var(--acc) 45%, transparent) 58%)}
h3{font-size:14.5px;color:color-mix(in srgb, var(--acc) 50%, var(--ink))}
.btn{border-radius:999px}
.btn.primary{background:color-mix(in srgb, var(--acc) 42%, var(--ink));border-color:transparent}
.pick.sel .t{text-decoration-color:var(--acc)}
.sws{display:inline-flex;gap:2px;align-items:center}
.sw{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.sw::before{content:"";width:20px;height:20px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 2px var(--paper), 0 0 0 3px transparent}
.sw.on::before{box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--pc)}
.blk{display:flex;flex-direction:column;gap:4px}
.blkbar{gap:8px}
textarea.blk-t{min-height:128px}
.mini{min-height:34px;padding:2px 4px;font-size:13px}
.graphin{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.graphin .f{flex:1 1 200px}
.graphin .nar{flex:0 0 76px}
.graph svg{display:block;width:100%;max-width:560px;height:auto}
.legend span{white-space:nowrap}
.thumbs{display:flex;flex-direction:column;gap:6px}
/* Colour sets: a neutral desk and paper, tinted by the chosen set. The set's colours are applied from the Page menu. */
:root{ --tint:#5f8f55; --desk-base:#e8e9ea; --paper-base:#fbfbf8; --c-today:#7aa63a; --c-books:#3f9a6c; --c-problems:#2f8f8a; --c-concepts:#a3a03a; --c-progress:#c7799a;
  --desk:color-mix(in srgb, var(--tint) 16%, var(--desk-base)); --paper:color-mix(in srgb, var(--tint) 3%, var(--paper-base)) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --desk-base:#101113; --paper-base:#1b1c1f; --desk:color-mix(in srgb, var(--tint) 10%, var(--desk-base)); --paper:color-mix(in srgb, var(--tint) 4%, var(--paper-base)) } }
:root[data-theme="dark"]{ --desk-base:#101113; --paper-base:#1b1c1f; --desk:color-mix(in srgb, var(--tint) 10%, var(--desk-base)); --paper:color-mix(in srgb, var(--tint) 4%, var(--paper-base)) }
@media (prefers-reduced-motion:no-preference){ body,.pg,.nav,.nav button,.btn,h1{transition:background-color .4s ease, box-shadow .4s ease, border-color .4s ease} }
@media (max-width:599.98px){ .lab-long{display:none} }
/* Lab header: the lab's name and its own sections */
.sub{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 20px;border-bottom:2px solid var(--acc);padding-bottom:4px;margin-bottom:22px}
.subname{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--acc) 55%, var(--ink));margin-right:4px}
.sub button{background:none;border:0;padding:8px 2px;min-height:40px;cursor:pointer;color:var(--soft);font-size:15.5px}
.sub button[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--acc)}
.sub .n{font-size:12.5px;color:var(--soft);font-weight:400}
.pals{display:flex;flex-wrap:wrap;gap:8px}
.palbtn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:40px}
.palbtn[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.dots{display:inline-flex}
.dots i{width:12px;height:12px;border-radius:50%;margin-left:-3px;box-shadow:0 0 0 1.5px var(--paper)}
.sheet{max-height:92%;overflow-y:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fgrid .wide{grid-column:1 / -1}
.pick .cur{font-size:12.5px;color:color-mix(in srgb, var(--acc) 55%, var(--ink));font-weight:600}
/* Cover: the closed notebook, in the colour set's tint, with a title plate and a door into each lab */
:root{ --cover-base:#1f2529; --cover-ink:#f3f5f0 }
.cover{position:relative;max-width:820px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:36px;padding-left:calc(max(20px, env(safe-area-inset-left, 0px)) + 22px);padding-right:max(20px, env(safe-area-inset-right, 0px));color:var(--cover-ink);
  background:linear-gradient(90deg, rgba(0,0,0,.28) 0 22px, transparent 22px), color-mix(in srgb, var(--tint) 58%, var(--cover-base))}
.cover::after{content:"";position:absolute;top:0;bottom:0;right:40px;width:10px;background:rgba(0,0,0,.2)}
.cover > *{position:relative;z-index:1}
@media (min-width:600px){ .cover{border-radius:6px 14px 14px 6px;padding-inline:62px 76px;box-shadow:0 2px 4px rgba(0,0,0,.15),0 14px 34px rgba(0,0,0,.2)} }
.plate{align-self:flex-start;max-width:440px;background:var(--paper);color:var(--ink);padding:18px 24px 20px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:4px}
.plate h1{background:none;padding:0;margin:0;font-size:44px;line-height:1.15}
.labs{display:grid;gap:16px}
@media (min-width:600px){ .labs{grid-template-columns:1fr 1fr} }
.lab{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);color:var(--ink);border:0;border-top:6px solid var(--tc);border-radius:4px;padding:18px 20px 16px;min-height:156px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.lab .go{margin-top:auto;padding-top:8px;font-weight:600;color:color-mix(in srgb, var(--tc) 55%, var(--ink))}
@media (prefers-reduced-motion:no-preference){ .lab{transition:transform .15s ease, box-shadow .15s ease} .lab:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.28)} }
.lab:focus-visible, .coverlinks button:focus-visible{outline-color:var(--cover-ink)}
.coverlinks{display:flex;flex-wrap:wrap;gap:4px 24px}
.coverlinks button{background:none;border:0;padding:8px 0;min-height:40px;color:var(--cover-ink);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
button.brand{background:none;border:0;padding:0;cursor:pointer;color:inherit}
.app.on-cover .nav{display:none}
.app.on-cover .brand, .app.on-cover .sim{visibility:hidden}
/* Cover, second pass: drawn background, the title set across the full width, an illustrated panel per lab */
:root{ --display:"Fraunces",Georgia,"Times New Roman",serif }
.cover{justify-content:space-between;gap:26px;overflow:hidden;padding-block:26px 30px}
.cover::after{display:none}
.cover .bgart{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ktop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.khead{display:flex;flex-direction:column}
.khead h1{background:none;padding:0;margin:0;align-self:stretch;line-height:0}
.ktitle{display:block;width:100%;height:auto;overflow:visible}
.ktitle text{font-family:var(--display);font-weight:600;fill:var(--cover-ink)}
.klab{align-self:flex-end;font-family:var(--hand);font-size:clamp(36px,8vw,68px);line-height:1.05;margin-top:-2px;padding:0 12px;transform:rotate(-4deg);color:var(--cover-ink);background:linear-gradient(transparent 56%, color-mix(in srgb, var(--c-today) 80%, transparent) 56%)}
.ktag{font-size:16.5px;max-width:34ch;margin-top:-6px;opacity:.92}
.lab{border-top:0;border-radius:12px;padding:0 0 16px;gap:0;min-height:0;overflow:hidden}
.lab .art{display:block;width:100%;height:auto;background:color-mix(in srgb, var(--tc) 20%, var(--paper))}
.lab .txt{display:flex;flex-direction:column;gap:6px;padding:14px 20px 0;flex:1}
.lab .h{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.2}
.lab .go{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lab .arr{flex:none;width:40px;height:40px;border-radius:50%;background:color-mix(in srgb, var(--tc) 70%, var(--ink));color:var(--paper);display:grid;place-items:center;font-size:20px;line-height:1}
.coverlinks{gap:10px}
.coverlinks button{border:1px solid color-mix(in srgb, var(--cover-ink) 45%, transparent);border-radius:999px;padding:6px 16px;text-decoration:none}
@media (max-width:599.98px){ .ktag{margin-top:6px} }
/* Cover finish: cloth texture, vignette, a foil frame and foil lettering. Deep colour sets bring their own cover and foil. */
:root{ --cover-bg:color-mix(in srgb, var(--tint) 58%, var(--cover-base)); --foil:var(--cover-ink) }
.cover{background:linear-gradient(90deg, rgba(0,0,0,.3) 0 22px, rgba(0,0,0,.12) 22px 24px, transparent 24px),
  radial-gradient(120% 90% at 50% 38%, transparent 55%, rgba(0,0,0,.28)),
  repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
  repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
  var(--cover-bg)}
.cover::before{content:"";position:absolute;inset:11px 11px 11px 35px;border:1px solid color-mix(in srgb, var(--foil) 55%, transparent);border-radius:3px 9px 9px 3px;pointer-events:none;z-index:1}
.ktitle text{fill:url(#kfoil)}
.ktop, .ktag{color:var(--foil)}
.klab{color:var(--cover-ink)}
.coverlinks button{border-color:color-mix(in srgb, var(--foil) 50%, transparent);color:var(--foil)}
.palgroup{font-size:12.5px;color:var(--soft);margin-top:4px}
/* Reading Lab drill-down: shelf rows, book page, chapter page */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:14px;color:var(--soft)}
.crumbs button{background:none;border:0;padding:6px 0;min-height:36px;color:var(--soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.shelf{display:flex;flex-direction:column;gap:10px}
.bookrow{display:grid;grid-template-columns:1fr minmax(150px,190px);gap:6px 20px;align-items:center;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-left:10px solid var(--tc);border-radius:4px 10px 10px 4px;padding:14px 18px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bookrow > span{display:flex;flex-direction:column;gap:3px;min-width:0}
.bookrow .bt{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.25}
.bookrow .side{align-items:flex-start}
.tagchip{font-size:12.5px;border:1px solid color-mix(in srgb, var(--tc) 60%, var(--line));border-radius:999px;padding:1px 10px;white-space:nowrap}
.prog{display:block;width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-block:3px}

@media (prefers-reduced-motion:no-preference){ .bookrow{transition:transform .15s ease, box-shadow .15s ease} .bookrow:hover{transform:translateX(3px);box-shadow:0 3px 10px rgba(0,0,0,.1)} }
@media (max-width:599.98px){ .bookrow{grid-template-columns:1fr} }
.libbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.libbar label{flex:1 1 200px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 20px}
.facts .k{color:var(--soft);font-size:14px;padding-top:2px}
.chrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;width:100%;text-align:left;background:none;border:0;padding:11px 0;cursor:pointer}

.chrow .cur{font-size:12.5px;font-weight:600;color:color-mix(in srgb, var(--acc) 55%, var(--ink));border:1px solid color-mix(in srgb, var(--acc) 55%, var(--line));border-radius:999px;padding:0 9px}
.chrow:hover .t{text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:4px}
/* Compact shelf for a large library: one line per book, sortable columns */
.btable{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 48px 100px 84px 44px;gap:0 14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-left:5px solid var(--tc, transparent);padding:7px 6px 7px 10px;min-height:38px;color:var(--ink);font-size:15px;cursor:pointer}

.bhead{cursor:default;min-height:30px;padding-block:2px}

@media (max-width:599.98px){ .brow{grid-template-columns:minmax(0,1fr) 82px;gap:0 10px} .brow .yr, .brow .pg2, .brow .nn{display:none} .brow .bt2{white-space:normal} .brow .bt2 b, .brow .au{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .brow .au::before{content:none} .bhead .bt2{white-space:nowrap} }
.libtools{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center;justify-content:space-between}
/* Analytical reading: five stages per book */
.stages{display:flex;flex-wrap:wrap;gap:8px}
.stagebtn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;min-height:40px;cursor:pointer;color:var(--soft)}
.stagebtn .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:1.5px solid currentColor}
.stagebtn.done .num{background:color-mix(in srgb, var(--acc) 70%, var(--ink));border-color:transparent;color:var(--paper)}
.stagebtn[aria-current="step"]{color:var(--ink);font-weight:600;border-color:var(--ink)}
span.stagebtn{cursor:default}
.gq{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3;text-wrap:balance}
.locked{border:1px dashed var(--soft);border-radius:8px;padding:16px;color:var(--soft)}
.partrow{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:4px 16px;align-items:end}
@media (max-width:599.98px){ .partrow{grid-template-columns:1fr} }
/* Each lab shows only its own tabs, plus Home */
.area{font-weight:600;font-size:15px;color:color-mix(in srgb, var(--acc) 55%, var(--ink))}
.area:not(:empty)::before{content:"› ";color:var(--soft);font-weight:400}

.brand, .area{white-space:nowrap}

/* Reading pass: study sections, concept prompts, comparison table */
.cmpwrap{overflow-x:auto}
table.cmp, table.cmp tbody{display:block;width:100%}
table.cmp tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
table.cmp tr td{display:block;padding:0;border:0;width:auto}
table.cmp tr td:first-child{grid-column:1 / -1;width:auto}

table.cmp td{vertical-align:top;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}

table.cmp textarea{min-height:64px}
.relrow{padding:8px 0;border-bottom:1px solid var(--line)}
/* Handwriting blocks: a pressure-sensitive canvas on graph paper */
:root{ --pen-red:var(--red) }
.inkwrap{border:1px solid var(--line);border-radius:6px;overflow-x:auto;overflow-y:hidden;background-color:var(--paper)}
canvas.ink{display:block;width:100%;touch-action:none;cursor:crosshair;background-image:linear-gradient(var(--gline) 1px,transparent 1px),linear-gradient(90deg,var(--gline) 1px,transparent 1px);background-size:calc(24px * var(--z, 1)) calc(24px * var(--z, 1))}
.inkbar{gap:0 14px}
.inkbar:empty{display:none}
.inkbar .opt{min-height:34px;padding:4px 0}
.inkshow svg{display:block;width:100%;height:auto}
.lines .mg .fix p:not(.small){color:var(--red)}
select{font:inherit;color:var(--pen);width:100%;background:transparent;border:0;border-bottom:1px solid var(--soft);padding:8px 2px;border-radius:0}
.picked{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}

.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}

.inkshow svg{border:1px solid var(--line);border-radius:8px}
/* Full screen: the page takes the whole screen; tools float and can be hidden */
.inkbox.fs{padding:0;gap:0}

.inkbox.fs canvas.ink{border:0;border-radius:0}

/* The cover is always the Ink cover, with deep general colours for its artwork, whatever colour set is chosen inside */

.pbox.off{border-style:dashed;border-color:#777;background:rgba(0,0,0,.12)}
.cuttag.in{left:2px;right:auto;top:2px}
.rubber{position:absolute;border:2px dashed #1f6fd0;background:rgba(31,111,208,.12);pointer-events:none}
.plist{display:flex;flex-direction:column;gap:6px;max-width:720px}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prow input{flex:1 1 140px;width:auto;min-width:0}
.prow select{flex:1 1 200px;min-width:0;width:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);background:var(--paper)}
.partrow{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);width:100%}
.partrow .row,.partrow .opts{justify-content:flex-start}
.plist{align-items:stretch}
input.redin{color:var(--red)!important;font-family:var(--hand);font-size:18px}
.hist.parts{margin-block:4px}
.prow .ppin{flex:0 1 130px}
/* Problem library: compact side list, attempt timeline, comparison */
.plistbox{display:flex;flex-direction:column;gap:2px;max-height:68vh;overflow-y:auto;padding-right:4px}
.pbook{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:7px 0 5px;cursor:pointer;color:var(--ink);font-weight:600;font-size:14.5px}
.pbook .t{flex:1;min-width:0}
.pbook .n,.prow2 .n{color:var(--soft);font-size:12.5px;font-weight:400;font-variant-numeric:tabular-nums}
.pgroup{display:flex;flex-direction:column;padding-left:14px}
.pgroup .secname{margin:6px 0 2px;font-size:11px}
.prow2{display:flex;justify-content:space-between;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:4px 6px 4px 8px;min-height:30px;cursor:pointer;color:var(--ink);font-size:14.5px}
.prow2:hover{background:color-mix(in srgb, var(--acc) 10%, transparent)}
.prow2.sel{border-left-color:var(--acc);background:color-mix(in srgb, var(--acc) 14%, transparent);font-weight:600}
.prow2 .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atl{display:flex;flex-direction:column}
.atrow{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;color:var(--ink);font-size:14.5px}
.atrow span:nth-child(2){flex:1;min-width:0;color:var(--soft)}
.atrow[aria-expanded="true"] span:nth-child(2){color:var(--ink)}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:20px;border:1px solid var(--line);border-radius:8px;padding:12px}
.cmp2 > div{min-width:0}
.cmp2 .mg{display:block}
.cmp2 .mg .ref{display:none}
@media (max-width:700px){ .cmp2{grid-template-columns:1fr} .plistbox{max-height:none} }
.evalbox{display:flex;flex-direction:column;gap:6px}
.verd{margin:0;font-weight:700;font-size:19px}
.verd.sm{font-size:inherit}
.verd.ok{color:#1d7a4c} .verd.mid{color:#b06a00} .verd.bad{color:var(--red)} .verd.na{color:var(--soft)}
.evalbox .kind{margin-top:6px}
.real .sim{display:none}
.kfirst{position:relative;margin:0;max-width:60ch;color:var(--cover-ink);font-size:16.5px;line-height:1.5}
.welchead{display:flex;flex-direction:column;gap:12px;margin:8vh 0 6vh;min-width:0}
.welc{font-family:var(--display);overflow-wrap:anywhere;background:none!important;font-size:clamp(40px,9vw,84px);line-height:1;margin:0;color:var(--foil);letter-spacing:.01em}
</style>

<script>
(function(){
  window.__KL_REAL = true;
  var DB = 'knowledge-lab', STORE = 'kv', db = null;
  function open(){ return new Promise(function(res, rej){ var r = indexedDB.open(DB, 1); r.onupgradeneeded = function(){ r.result.createObjectStore(STORE); }; r.onsuccess = function(){ db = r.result; res(db); }; r.onerror = function(){ rej(r.error); }; }); }
  function get(k){ return new Promise(function(res, rej){ var t = db.transaction(STORE).objectStore(STORE).get(k); t.onsuccess = function(){ res(t.result); }; t.onerror = function(){ rej(t.error); }; }); }
  window.__KL_SAVE = function(state){ return new Promise(function(res, rej){ if(!db) return rej(new Error('no database')); var tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(state, 'state'); tx.oncomplete = function(){ res(); }; tx.onerror = tx.onabort = function(){ rej(tx.error); }; }); };
  function start(){ var s = document.createElement('script'); s.src = 'app.js?v=0b6ca797f4'; document.body.appendChild(s); }
  open().then(function(){ return get('state'); }).then(function(st){ window.__KL_STATE = st || null; }).catch(function(){ window.__KL_STATE = null; }).then(function(){
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
    start(); });
  if('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();</script>
